name: P2 universal sequential selection final

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P2 universal sequential selection final fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace selection components and remove implementation messages
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()

          start=s.find('function WHUpload(')
          end=s.find('function VendorPending(', start)
          if start < 0 or end < 0:
              raise SystemExit('WHUpload boundaries not found')

          wh=r'''function WHUpload({profile,mapping,token,onDone}){
            const[step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
            const rows=(mapping||[]).map(x=>({...x,company:x.company||x.organization||'',organization:x.organization||x.company||'',project:x.project||x.project_location||'',project_location:x.project||x.project_location||''}));
            const orgs=[...new Set(rows.map(x=>x.company).filter(Boolean))];
            const whs=[...new Set(rows.filter(x=>x.company===org).map(x=>x.warehouse).filter(Boolean))];
            const projects=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh).map(x=>x.project).filter(Boolean))];
            const vendors=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project).map(x=>x.vendor).filter(Boolean))];
            const services=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))];
            const subs=P2_SUB_SERVICES[service]||[];
            const contracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:service?['Commercial','Minimum Wages']:[];

            const resetFromCompany=()=>{setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')};
            const resetFromWarehouse=()=>{setProject('');setVendor('');setContract('');setService('');setSub('')};
            const resetFromProject=()=>{setVendor('');setContract('');setService('');setSub('')};
            const resetFromVendor=()=>{setContract('');setService('');setSub('')};
            const resetFromContract=()=>{setService('');setSub('')};
            const resetFromService=()=>setSub('');

            const choose=(label,value,options,active,next,setter,clear)=> <div className="p2-choice"><select value={value} disabled={step!==active} onChange={e=>{setter(e.target.value);clear();setMsg('')}}><option value="">Select {label}</option>{options.map(v=><option key={v} value={v}>{v}</option>)}</select><button type="button" onClick={()=>{if(!value){setMsg(`Select ${label} before continuing.`);return}setMsg('');setStep(next)}} disabled={step!==active||!value||busy}>Select</button></div>;

            const submit=async()=>{if(!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length||!remarks.trim()){setMsg('Complete every selection, upload at least one document, and enter Remarks before Submit.');return}try{setBusy(true);const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
            const uploadReady=files.length>0;
            return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><div className="p2-compact-grid">
              <div className="p2-grid-cell"><strong>Upload Docs</strong><div className="p2-choice"><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" disabled={step!==0||busy} onChange={e=>{setFiles([...e.target.files]);setMsg('')}}/><button type="button" onClick={()=>{if(!uploadReady){setMsg('Select at least one document before continuing.');return}setMsg('');setStep(1)}} disabled={step!==0||!uploadReady||busy}>Select</button></div></div>
              <div className="p2-grid-cell"><strong>Company</strong>{choose('Company',org,orgs,1,2,setOrg,resetFromCompany)}</div>
              <div className="p2-grid-cell"><strong>Warehouse</strong>{choose('Warehouse',wh,whs,2,3,setWh,resetFromWarehouse)}</div>
              <div className="p2-grid-cell"><strong>Project</strong>{choose('Project',project,projects,3,4,setProject,resetFromProject)}</div>
              <div className="p2-grid-cell"><strong>Vendor</strong>{choose('Vendor',vendor,vendors,4,5,setVendor,resetFromVendor)}</div>
              <div className="p2-grid-cell"><strong>Contract Type</strong>{choose('Contract Type',contract,contracts,5,6,setContract,resetFromContract)}</div>
              <div className="p2-grid-cell"><strong>Service Type</strong>{choose('Service Type',service,services,6,7,setService,resetFromService)}</div>
              <div className="p2-grid-cell"><strong>Sub-category</strong>{choose('Sub-category',sub,subs,7,8,setSub,()=>{})}</div>
            </div><div className="p2-bottom-grid"><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step!==8||busy} placeholder={step===8?'Enter remarks':'Select Sub-category and press Select first'}/></label><div><strong>Selected Documents</strong><div>{files.length?files.map(f=><div key={f.name}>{f.name}</div>):'None selected'}</div></div></div><button className="primary" disabled={step!==8||!files.length||!remarks.trim()||busy} onClick={submit}>{busy?'Submitting…':'Submit to Vendor'}</button>{msg&&<div className="notice">{msg}</div>}<style>{`.p2-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.p2-grid-cell{min-width:0}.p2-grid-cell strong{display:block;margin-bottom:5px}.p2-choice{display:flex;gap:6px;align-items:center}.p2-choice select,.p2-choice input{width:100%;box-sizing:border-box}.p2-choice button{white-space:nowrap}.p2-bottom-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:10px}.p2-bottom-grid textarea{width:100%;min-height:70px;box-sizing:border-box}@media(max-width:900px){.p2-compact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.p2-compact-grid,.p2-bottom-grid{grid-template-columns:1fr}}`}</style></section>
          }

          '''
          s=s[:start]+wh+s[end:]

          # Route-2 Vendor Submit gets the same explicit sequential selection for its editable heads.
          start=s.find('function VendorSubmit(')
          end=s.find('function StatusTable(', start)
          if start < 0 or end < 0:
              raise SystemExit('VendorSubmit boundaries not found')
          old=s[start:end]
          new=r'''function VendorSubmit({profile,request,mapping,route2=false,onSubmit,onCancel}){const[step,setStep]=useState(route2?0:3),[inv,setInv]=useState(''),[date,setDate]=useState(''),[month,setMonth]=useState(''),[amt,setAmt]=useState(''),[remarks,setRemarks]=useState(''),[file,setFile]=useState(null),[support,setSupport]=useState([]),[org,setOrg]=useState(request?.organization||''),[wh,setWh]=useState(request?.warehouse||''),[project,setProject]=useState(request?.project_location||''),[vendor,setVendor]=useState(request?.vendor||profile?.display_name||''),[service,setService]=useState(request?.service_type||''),[sub,setSub]=useState(request?.sub_service||''),[contract,setContract]=useState(request?.contract_type||'');const maxMonth=previousInvoiceMonth();const calculatedGst=Math.round((Number(amt)||0)*0.18*100)/100;const total=(Number(amt)||0)+calculatedGst;const rows=mapping||[];const orgs=[...new Set(rows.map(x=>x.organization).filter(Boolean))],whs=[...new Set(rows.filter(x=>x.organization===org).map(x=>x.warehouse).filter(Boolean))],projects=[...new Set(rows.filter(x=>x.organization===org&&x.warehouse===wh).map(x=>x.project_location).filter(Boolean))],vendors=[...new Set(rows.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project).map(x=>x.vendor).filter(Boolean))],services=[...new Set(rows.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))],subs=P2_SUB_SERVICES[service]||[],contracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:service?['Commercial','Minimum Wages']:[];const pick=(label,value,options,idx,next,setter,clear)=><div className="p2-choice"><select value={value} disabled={!route2||step!==idx} onChange={e=>{setter(e.target.value);clear()}}><option value="">Select {label}</option>{options.map(x=><option key={x}>{x}</option>)}</select><button type="button" onClick={()=>{if(!value){alert(`Select ${label} before continuing.`);return}setStep(next)}} disabled={!route2||step!==idx||!value}>Select</button></div>;const submit=()=>{if(!inv||!month||!date||!amt||!file||!org||!wh||!project||!vendor||!service||!sub||!contract){alert('Complete all mandatory invoice details.');return}if(route2?month>=maxMonth:month!==maxMonth){alert(route2?`Route 2 is only for invoices before ${maxMonth}.`:`WH-initiated invoices must be for ${maxMonth}.`);return}onSubmit({inv_no:inv,invoice_month:month,invoice_date:date,taxable_amt:Number(amt)||0,gst_amt:calculatedGst,amt_incl_gst:total,organization:org,company:org,warehouse:wh,vendor,project_location:project,contract_type:contract,service_type:service,sub_service:sub,remarks,documents:[{type:'Invoice',file},...support.map(f=>({type:'Supporting Document',file:f}))]})};return <section className="panel form-panel"><div className="panel-heading"><h2>{route2?'Submit Invoice — Prior Period Route':'Raise Invoice'}</h2>{onCancel&&<button onClick={onCancel}>Back</button>}</div>{route2&&<div className="p2-compact-grid"><div className="p2-grid-cell"><strong>Company</strong>{pick('Company',org,orgs,0,1,setOrg,()=>{setWh('');setProject('');setVendor('');setService('');setSub('');setContract('')})}</div><div className="p2-grid-cell"><strong>Warehouse</strong>{pick('Warehouse',wh,whs,1,2,setWh,()=>{setProject('');setVendor('');setService('');setSub('');setContract('')})}</div><div className="p2-grid-cell"><strong>Project</strong>{pick('Project',project,projects,2,3,setProject,()=>{setVendor('');setService('');setSub('');setContract('')})}</div><div className="p2-grid-cell"><strong>Vendor</strong>{pick('Vendor',vendor,vendors,3,4,setVendor,()=>{setService('');setSub('');setContract('')})}</div><div className="p2-grid-cell"><strong>Contract Type</strong>{pick('Contract Type',contract,contracts,4,5,setContract,()=>{setService('');setSub('')})}</div><div className="p2-grid-cell"><strong>Service Type</strong>{pick('Service Type',service,services,5,6,setService,()=>setSub(''))}</div><div className="p2-grid-cell"><strong>Sub-category</strong>{pick('Sub-category',sub,subs,6,7,setSub,()=>{})}</div></div>}<div className="form-grid"><label>Organization{route2?<input readOnly value={org}/>:<input readOnly value={org}/>}</label><label>Warehouse<input readOnly value={wh}/></label><label>Project<input readOnly value={project}/></label><label>Vendor<input readOnly value={vendor}/></label><label>Service<input readOnly value={service}/></label><label>Sub Service<input readOnly value={sub}/></label><label>Contract Type<input readOnly value={contract}/></label><label>Invoice Number<input value={inv} onChange={e=>setInv(e.target.value)}/></label><label>Invoice Month<input type="month" min={route2?'2000-01':maxMonth} max={maxMonth} value={month} onChange={e=>setMonth(e.target.value)}/></label><label>Invoice Date<input type="date" value={date} onChange={e=>setDate(e.target.value)}/></label><label>Invoice Amount<input type="number" min="0" step="0.01" value={amt} onChange={e=>setAmt(e.target.value)}/></label><label>GST @ 18%<input readOnly value={number(calculatedGst)}/></label><label>Total<input readOnly value={number(total)}/></label></div><label>Invoice PDF<input type="file" accept="application/pdf,.pdf" onChange={e=>setFile(e.target.files?.[0]||null)}/></label><label>Supporting Documents<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" onChange={e=>setSupport([...e.target.files])}/></label><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)}/></label><button className="primary" disabled={!inv||!month||!date||!amt||!file||(route2&&step!==7)} onClick={submit}>Submit to Warehouse</button></section>}

          '''
          s=s[:start]+new+s[end:]

          # Remove the exact implementation text from every source file and normalize the user-facing Project label.
          root=Path('app/frontend/src')
          patterns=[r'Universal sequential selection:[^<\n]*',r'Complete the steps in order\.[^<\n]*']
          for f in root.rglob('*'):
              if not f.is_file() or f.suffix not in {'.js','.jsx','.css','.md'}: continue
              t=f.read_text()
              n=t.replace('Project / Location','Project').replace('Project & Location','Project')
              for pat in patterns: n=re.sub(pat,'',n,flags=re.I)
              if n!=t: f.write_text(n)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 universal sequential selection final fix'
          git push origin development
