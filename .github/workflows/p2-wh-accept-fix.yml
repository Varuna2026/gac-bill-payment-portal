name: P2 Warehouse Accept transition fix
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P2 Warehouse Accept transition fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Warehouse Accept transition
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/frontend/src/services/gitDatabase.js')
          s=p.read_text()
          old=" if(role==='WH'&&status==='SUBMITTED'&&ns==='GAC_COMPLIANCE'&&nst==='PR_MAPPED')return"
          new=" if(role==='WH'&&status==='SUBMITTED'&&ns==='WH'&&nst==='ACCEPTED')return\n if(role==='WH'&&status==='SUBMITTED'&&ns==='GAC_COMPLIANCE'&&nst==='PR_MAPPED')return"
          if "ns==='WH'&&nst==='ACCEPTED'" not in s:
              if old not in s: raise SystemExit('Expected Warehouse transition line not found')
              p.write_text(s.replace(old,new,1))
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/services/gitDatabase.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 Warehouse Accept transition fix'
          git push origin development
