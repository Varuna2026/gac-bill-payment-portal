name: P2 fix WH Submitted tab
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Patch WH Submitted tab only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="""if(active==='Submitted'){ if(role===ROLES.WH) return baseVisible.filter(x=>x.current_stage==='GAC_COMPLIANCE' || submittedByRole.has(x.id)); return baseVisible.filter(x=>submittedByRole.has(x.id)) }"""
          new="""if(active==='Submitted'){ if(role===ROLES.WH){ const submittedRequests=whSubmittedRequests.map(r=>({id:`REQ-${r.id}`,inv_no:'—',company:r.company||r.organization,warehouse:r.warehouse,project_location:r.project_location,vendor:r.vendor,service_type:r.service_type,sub_category:r.sub_service,contract_type:r.contract_type,current_status:'PENDING_VENDOR',current_stage:'WH',status_message:'Submitted to Vendor',warehouse_remarks:r.remarks||'',created_at:r.created_at})); const submittedInvoices=baseVisible.filter(x=>x.current_stage==='GAC_COMPLIANCE' || submittedByRole.has(x.id)); return [...submittedRequests,...submittedInvoices] } return baseVisible.filter(x=>submittedByRole.has(x.id)) }"""
          if old not in s: raise SystemExit('WH Submitted tab target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit App.jsx only and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git rm .github/workflows/p2-fix-wh-submitted.yml
          git diff --cached --check
          git commit -m "P2: fix Warehouse Submitted tab visibility"
          git push origin development
