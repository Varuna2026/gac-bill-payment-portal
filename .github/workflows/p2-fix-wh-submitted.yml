name: P2 fix Warehouse Submitted tab

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Fix Warehouse Submitted tab
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = "if(active==='Submitted'&&role===ROLES.WH)return <WarehouseSubmittedRequests requests={whSubmittedRequests}/>"
          new = "if(active==='Submitted'&&role===ROLES.WH)return <StatusTable data={rows} role={role} onAction={doAction} title={active} showWarehouseRemarks={true} history={history}/>"
          if old not in s:
              raise SystemExit('Expected Warehouse Submitted tab code was not found; refusing to modify App.jsx.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

      - name: Build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git commit -m "P2: fix Warehouse Submitted tab" || true
          git push origin development
          git rm .github/workflows/p2-fix-wh-submitted.yml
          git commit -m "P2: remove temporary Warehouse Submitted fixer"
          git push origin development
