name: P2 Complete Workflow Repair

on:
  workflow_dispatch:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Repair App workflow transitions
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          s=re.sub(r"const actionsByRole=\{.*?\}", "const actionsByRole={WH:['Accept','Map PR','Submit to GAC Compliance','Query','Return','Reject','Resubmit to GAC Compliance'],GAC_COMPLIANCE:['Accept','Query','Return','Reject','Compliance Check OK','Compliance Check Rejected'],GAC_PO:['Accept','Query','Return','Reject','PO Mapping','Submit'],ACCOUNTS:['Accept','Query','Return','Reject','Paid'],CBO_OFFICE:['Accept','Query','Return','Reject','Submit'],CBO_OFFICER:['Approve','Query','Return','Reject']}", s, count=1)
          s=s.replace("else if(role===ROLES.GAC_PO){const poRows=await selectRows('pr_po_utr',`&invoice_id=eq.${inv.id}`,token);if(!poRows.length||!poRows[0].po_number){setError('PO Number is mandatory before Submit.');return}const returnedFromCbo=history.filter(h=>h.invoice_id===inv.id&&h.from_stage==='CBO_OFFICE'&&h.to_stage==='GAC_PO').length;ns=WORKFLOW_STATUS.PO_MAPPED;nstage=returnedFromCbo>=2?'ACCOUNTS':'CBO_OFFICE'}else if(role===ROLES.CBO_OFFICE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='GAC_PO'}else if(role===ROLES.ACCOUNTS)", "else if(role===ROLES.GAC_PO){const poRows=await selectRows('pr_po_utr',`&invoice_id=eq.${inv.id}`,token);if(!poRows.length||!poRows[0].po_number){setError('PO Number is mandatory before Submit.');return}ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICE'}else if(role===ROLES.CBO_OFFICE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICER'}else if(role===ROLES.ACCOUNTS)", 1)
          s=s.replace("else if(act==='PO Mapping'){const po=(routeChoice||'').trim();if(!po)return;extra={po_number:po,po_mapped_by:profile.id,po_mapped_at:now};ns=WORKFLOW_STATUS.ACCEPTED;nstage='GAC_PO'}", "else if(act==='PO Mapping'){const po=(routeChoice||'').trim();if(!po)return;extra={po_number:po,po_mapped_by:profile.id,po_mapped_at:now};ns=WORKFLOW_STATUS.PO_MAPPED;nstage='GAC_PO'}", 1)
          s=s.replace("else if(act==='Approve'){ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage=roleStage[role]}", "else if(act==='Approve'){ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage='ACCOUNTS'}", 1)
          p.write_text(s)

      - name: Replace central workflow gate with complete matrix
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/services/gitDatabase.js')
          s=p.read_text()
          start=s.index('function assertTransition(row,v){')
          end=s.index('\nexport async function selectRows', start)
          gate=r'''function assertTransition(row,v){
const role=sessionProfile()?.role
if(!role||role==='ADMIN')return
const stage=row.current_stage,status=row.current_status,ns=v.current_stage,nst=v.current_status
const remarks=String(v.latest_remarks??'').trim()
const fail=m=>{throw Error(`Workflow gate failed: ${m}`)}
const stageFor={VENDOR:'VENDOR',WH:'WH',GAC_COMPLIANCE:'GAC_COMPLIANCE',GAC_PO:'GAC_PO',ACCOUNTS:'ACCOUNTS',CBO_OFFICE:'CBO_OFFICE',CBO_OFFICER:'CBO_OFFICER'}
if(stage!==stageFor[role])fail(`only ${role} may action this stage`)
if(nst==='REJECTED'&&!remarks)fail('Remarks are mandatory when an invoice is rejected')
const ok=(s,st,d,ds)=>stage===s&&status===st&&ns===d&&nst===ds
if(ok('VENDOR','RETURNED','WH','SUBMITTED'))return
if(ok('VENDOR','SUBMITTED','WH','SUBMITTED'))return
if(ok('WH','SUBMITTED','WH','ACCEPTED'))return
if(ok('WH','ACCEPTED','WH','ACCEPTED'))return
if(ok('WH','ACCEPTED','GAC_COMPLIANCE','PR_MAPPED'))return
if(ok('WH','SUBMITTED','GAC_COMPLIANCE','PR_MAPPED'))return
if(ok('WH','RETURNED','GAC_COMPLIANCE','PR_MAPPED'))return
if(ok('GAC_COMPLIANCE','PR_MAPPED','GAC_COMPLIANCE','ACCEPTED'))return
if(ok('GAC_COMPLIANCE','SUBMITTED','GAC_COMPLIANCE','ACCEPTED'))return
if(ok('GAC_COMPLIANCE','ACCEPTED','GAC_COMPLIANCE','ACCEPTED'))return
if(ok('GAC_COMPLIANCE','ACCEPTED','GAC_COMPLIANCE','UNDER_COMPLIANCE_CHECK'))return
if(ok('GAC_COMPLIANCE','UNDER_COMPLIANCE_CHECK','GAC_COMPLIANCE','UNDER_COMPLIANCE_CHECK'))return
if(ok('GAC_COMPLIANCE','ACCEPTED','GAC_PO','SUBMITTED'))return
if(ok('GAC_COMPLIANCE','UNDER_COMPLIANCE_CHECK','GAC_PO','SUBMITTED'))return
if(ok('GAC_COMPLIANCE','ACCEPTED','GAC_PO','COMPLIANCE_CHECKED'))return
if(ok('GAC_COMPLIANCE','UNDER_COMPLIANCE_CHECK','GAC_PO','COMPLIANCE_CHECKED'))return
if(ok('GAC_PO','SUBMITTED','GAC_PO','ACCEPTED'))return
if(ok('GAC_PO','COMPLIANCE_CHECKED','GAC_PO','ACCEPTED'))return
if(ok('GAC_PO','ACCEPTED','GAC_PO','ACCEPTED'))return
if(ok('GAC_PO','ACCEPTED','GAC_PO','PO_MAPPED'))return
if(ok('GAC_PO','PO_MAPPED','GAC_PO','PO_MAPPED'))return
if(ok('GAC_PO','PO_MAPPED','GAC_PO','ACCEPTED'))return
if(ok('GAC_PO','PO_MAPPED','CBO_OFFICE','SUBMITTED'))return
if(ok('ACCOUNTS','PO_MAPPED','ACCOUNTS','ACCEPTED'))return
if(ok('ACCOUNTS','ACCEPTED','CBO_OFFICER','SUBMITTED'))return
if(ok('CBO_OFFICE','SUBMITTED','CBO_OFFICE','ACCEPTED'))return
if(ok('CBO_OFFICE','ACCEPTED','CBO_OFFICE','ACCEPTED'))return
if(ok('CBO_OFFICE','ACCEPTED','CBO_OFFICER','SUBMITTED'))return
if(ok('CBO_OFFICE','SUBMITTED','CBO_OFFICER','SUBMITTED'))return
if(ok('CBO_OFFICE','ACCEPTED','CBO_OFFICER','SUBMITTED'))return
if(ok('CBO_OFFICER','SUBMITTED','ACCOUNTS','APPROVED_FOR_PAYMENT'))return
if(ok('ACCOUNTS','APPROVED_FOR_PAYMENT','ACCOUNTS','PAID'))return
if(['QUERY','RETURNED','REJECTED'].includes(nst)){
  const d={WH:['VENDOR'],GAC_COMPLIANCE:['VENDOR','WH'],GAC_PO:['VENDOR','WH'],ACCOUNTS:['GAC_PO'],CBO_OFFICE:['ACCOUNTS','GAC_PO','WH','VENDOR'],CBO_OFFICER:['CBO_OFFICE','ACCOUNTS','GAC_PO','WH','VENDOR']}[role]||[]
  if(!d.includes(ns))fail(`invalid destination ${ns}`)
  return
}
fail(`${role} cannot change ${stage}/${status} to ${ns}/${nst}`)
}
'''
          s=s[:start]+gate+s[end:]
          p.write_text(s)

      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx app/frontend/src/services/gitDatabase.js
          git diff --cached --quiet || git commit -m "Repair complete P2 workflow through Paid"
          git push origin development
