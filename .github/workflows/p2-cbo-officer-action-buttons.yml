name: Fix CBO Officer action buttons

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix CBO Officer action buttons')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Patch CBO Officer Received & Under Process actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text()
          old = "if(isReceivedProcess&&role===ROLES.CBO_OFFICER)return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>{x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT?<button className='primary' onClick={()=>onAction(x,'Submit')}>Submit</button>:<button className='primary' onClick={()=>onAction(x,'Approve')}>Approved</button>}</div>;"
          new = "if(isReceivedProcess&&role===ROLES.CBO_OFFICER)return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className='primary' onClick={()=>onAction(x,'Approve')}>Approve</button><button onClick={()=>onAction(x,'Query')}>Query</button><button onClick={()=>onAction(x,'Return')}>Return</button><button onClick={()=>onAction(x,'Reject')}>Reject</button></div>;"
          if old not in s:
              raise SystemExit('Expected CBO Officer action block not found; no change made.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix CBO Officer action buttons"
          git push origin HEAD:development
