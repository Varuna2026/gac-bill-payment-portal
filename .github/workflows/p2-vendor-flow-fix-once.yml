name: P2 Vendor Flow One-Time Fix

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Apply exact P2 vendor-flow fix
        run: python3 .github/p2_vendor_fix.py
      - name: Commit source fix
        run: |
          git config user.name "P2 Workflow Fix"
          git config user.email "actions@github.com"
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P2 restore Vendor Accept gate and carry mapping"
          git push origin development
