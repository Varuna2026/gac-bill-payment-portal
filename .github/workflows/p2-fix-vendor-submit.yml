name: P2 fix Vendor Submit to Warehouse

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Fix Vendor Submit button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old='<button className="primary" disabled={busy}>{busy?\'Submitting…\':\'Submit to Warehouse\'}</button>'
          new='<button type="button" className="primary" disabled={busy} onClick={submit}>{busy?\'Submitting…\':\'Submit to Warehouse\'}</button>'
          if old not in s:
              raise SystemExit('Expected Vendor Submit button not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit and remove temporary fixer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git commit -m "P2: fix Vendor Submit to Warehouse button"
          git rm .github/workflows/p2-fix-vendor-submit.yml
          git commit -m "P2: remove temporary Vendor submit fixer"
          git push origin HEAD:development
