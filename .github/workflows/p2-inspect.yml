name: P2 inspect
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect StatusTable
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/frontend/src/App.jsx').read_text()
          a=s.find('function StatusTable')
          b=s.find('function ',a+10)
          Path('/tmp/status.txt').write_text(s[a:b if b!=-1 else len(s)])
          PY
          cp /tmp/status.txt p2-status-debug.txt
      - name: Commit debug
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p2-status-debug.txt
          git commit -m 'chore: inspect P2 StatusTable' || exit 0
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm .github/workflows/p2-inspect.yml || true
          git commit -m 'chore: remove temporary P2 inspect workflow' || true
          git push || true
