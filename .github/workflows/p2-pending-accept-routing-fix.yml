name: P2 pending accept routing fix
on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'P2 pending accept routing fix') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Fix pending Accept to use real workflow transition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="if(routeChoice==='RECEIVE'){ns=WORKFLOW_STATUS.ACCEPTED;nstage=roleStage[role];}else if(act==='Accept'){"
          new="if(routeChoice==='RECEIVE'){routeChoice=null;}if(act==='Accept'){"
          if old not in s:
              raise SystemExit('Expected pending Accept routing code not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "P2 pending accept routing fix"
          git push origin development
