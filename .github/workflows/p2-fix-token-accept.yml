name: P2 fix token scope for Accept
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Patch token scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="function StatusTable({data,role,onAction,title,showWarehouseRemarks=false,history=[]}){const acts=actionsByRole[role]||[];const[viewed,setViewed]=useState({});"
          new="function StatusTable({data,role,onAction,title,showWarehouseRemarks=false,history=[],token}){const acts=actionsByRole[role]||[];const[viewed,setViewed]=useState({});"
          if old not in s:
              raise SystemExit('StatusTable signature anchor not found')
          s=s.replace(old,new,1)
          # Every StatusTable instance in App must receive the authenticated token used by openDocuments.
          def add_token(m):
              tag=m.group(0)
              if re.search(r'\\btoken\\s*=',tag): return tag
              return tag[:-1] + ' token={token}>'
          s=re.sub(r'<StatusTable\\b[^>]*>',add_token,s)
          p.write_text(s)
          PY
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/p2-fix-token-accept.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/frontend/src/App.jsx .github/workflows/p2-fix-token-accept.yml
          git commit -m 'P2: fix token scope for Warehouse Accept'
          git push origin development
