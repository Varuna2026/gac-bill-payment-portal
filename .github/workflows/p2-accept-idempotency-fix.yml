name: P2 Warehouse Accept idempotency fix
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P2 Warehouse Accept idempotency fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Patch PR mapping idempotency guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="if(latest&&latest.current_stage===nstage&&latest.current_status===ns){setNotice(latest.latest_remarks||`${act} already recorded.`);refreshData();return}"
          new="if(!Object.keys(extra).length&&latest&&latest.current_stage===nstage&&latest.current_status===ns){setNotice(latest.latest_remarks||`${act} already recorded.`);refreshData();return}"
          if old not in s:
              raise SystemExit('Expected idempotency guard not found')
          p.write_text(s.replace(old,new,1))
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          git commit -m 'Apply P2 Warehouse Accept idempotency fix'
          git push origin development
