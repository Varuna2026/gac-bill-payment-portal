name: P2 fix Vendor Accept -> Received & Under Process
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Patch only Vendor Accept transition
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old_sig = "function VendorPendingRequests({requests,selectedRequest,setSelectedRequest,onSubmit,token})"
          new_sig = "function VendorPendingRequests({requests,selectedRequest,setSelectedRequest,onSubmit,token,onRefresh})"
          if old_sig not in s:
              raise SystemExit('VendorPendingRequests signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_accept = "await updateRows('bill_requests',`id=eq.${req.id}`,{status:'VENDOR_RECEIVED',vendor_received_at:new Date().toISOString(),vendor_received_by:req.vendor},token);setR(req);setSelectedRequest(req)"
          new_accept = "await updateRows('bill_requests',`id=eq.${req.id}`,{status:'VENDOR_RECEIVED',vendor_received_at:new Date().toISOString(),vendor_received_by:req.vendor},token);const verify=await selectRows('bill_requests',`id=eq.${req.id}`,token);if(verify[0]?.status!=='VENDOR_RECEIVED')throw new Error('Vendor request did not move to Received & Under Process.');await onRefresh?.();setR(req);setSelectedRequest(req)"
          if old_accept not in s:
              raise SystemExit('Vendor Accept update block not found')
          s = s.replace(old_accept, new_accept, 1)
          old_render = "<VendorPendingRequests requests={visibleReq} selectedRequest={selectedRequest} setSelectedRequest={setSelectedRequest} onSubmit={raiseInvoice} token={token}/>"
          new_render = "<VendorPendingRequests requests={visibleReq} selectedRequest={selectedRequest} setSelectedRequest={setSelectedRequest} onSubmit={raiseInvoice} token={token} onRefresh={refreshData}/>"
          if old_render not in s:
              raise SystemExit('VendorPendingRequests render not found')
          s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx .github/workflows/p2-fix-vendor-received-tab.yml
          git commit -m "P2 Vendor Accept moves request to Received & Under Process"
          git push origin development
