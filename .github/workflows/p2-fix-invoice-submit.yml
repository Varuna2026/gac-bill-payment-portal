name: P2 fix invoice submit flow
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Restore known working submit flow and enforce month range
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = "if(!isAllowedInvoiceMonth(invMonth)){setError('Invoice Month must be the current month or the immediately previous month only.');return}"
          if old in s:
              s = s.replace(old, '', 1)
          old_input = '<input type="month" value={invMonth} onChange={e=>setInvMonth(e.target.value)} required/>'
          new_input = '<input type="month" value={invMonth} min={previousInvoiceMonth()} max={`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,\'0\')}`} onChange={e=>setInvMonth(e.target.value)} required/>'
          if old_input not in s:
              raise SystemExit('Invoice month input not found')
          s = s.replace(old_input, new_input, 1)
          p.write_text(s, encoding='utf-8')
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx .github/workflows/p2-fix-invoice-submit.yml
          git commit -m "P2: restore Vendor submit and enforce invoice month range"
          git push origin development
