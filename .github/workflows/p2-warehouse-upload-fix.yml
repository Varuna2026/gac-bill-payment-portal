name: P2 Warehouse Upload Docs fix

on:
  push:
    branches:
      - development

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply Warehouse sequential selection and login cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text()
          msg = '${{ github.event.head_commit.message }}'
          if msg == 'Apply P2 Warehouse Upload Docs fix':
              raise SystemExit(0)

          # Remove the login-screen P2V2 secure sign-in line.
          s = s.replace('<p className="login-subtitle">P2V2 secure sign-in</p>', '')

          # Use the exact Warehouse navigation label.
          s = s.replace("active==='Upload Documents'&&role===ROLES.WH", "active==='Upload Docs'&&role===ROLES.WH")

          # Replace the Warehouse upload form with a strict one-by-one Select sequence.
          start = s.find('function WHUpload(')
          end = s.find('function VendorPending(', start)
          if start < 0 or end < 0:
              raise SystemExit('WHUpload component boundaries not found')

          wh = r'''function WHUpload({profile,mapping,token,onDone}){
            const[step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState('');
            const orgs=[...new Set(mapping.map(x=>x.organization))],whs=[...new Set(mapping.filter(x=>x.organization===org).map(x=>x.warehouse))],projects=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh).map(x=>x.project_location))],vendors=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project).map(x=>x.vendor))],services=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project&&x.vendor===vendor).map(x=>x.service_type))],subs=P2_SUB_SERVICES[service]||[],allowedContracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:['Commercial','Minimum Wages'];
            const resetFrom=n=>{if(n<=0){setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')}else if(n===1){setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')}else if(n===2){setProject('');setVendor('');setContract('');setService('');setSub('')}else if(n===3){setVendor('');setContract('');setService('');setSub('')}else if(n===4){setContract('');setService('');setSub('')}else if(n===5){setService('');setSub('')}else if(n===6){setSub('')}};
            const choose=(n,fn)=>{fn();setMsg('');setStep(n+1)};
            const submit=async()=>{if(!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length){setMsg('Complete every Select step and upload at least one document before Submit.');return}try{const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}};
            const rows=[
              {label:'Upload Docs',done:files.length>0,active:step===0,button:<><input id="wh-doc-upload" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" style={{display:'none'}} onChange={e=>{setFiles([...e.target.files]);if(e.target.files.length)setStep(1)}}/><button className="primary" type="button" onClick={()=>document.getElementById('wh-doc-upload').click()}>Select</button></>},
              {label:'Organization',value:org,active:step===1,button:<button type="button" disabled={step!==1||!orgs.length} onClick={()=>{if(orgs.length)choose(1,()=>setOrg(orgs[0]))}}>Select</button>},
              {label:'Warehouse',value:wh,active:step===2,button:<button type="button" disabled={step!==2||!whs.length} onClick={()=>{if(whs.length)choose(2,()=>setWh(whs[0]))}}>Select</button>},
              {label:'Project & Location',value:project,active:step===3,button:<button type="button" disabled={step!==3||!projects.length} onClick={()=>{if(projects.length)choose(3,()=>setProject(projects[0]))}}>Select</button>},
              {label:'Vendor',value:vendor,active:step===4,button:<button type="button" disabled={step!==4||!vendors.length} onClick={()=>{if(vendors.length)choose(4,()=>setVendor(vendors[0]))}}>Select</button>},
              {label:'Contract Type',value:contract,active:step===5,button:<button type="button" disabled={step!==5||!allowedContracts.length} onClick={()=>{if(allowedContracts.length)choose(5,()=>setContract(allowedContracts[0]))}}>Select</button>},
              {label:'Service Type',value:service,active:step===6,button:<button type="button" disabled={step!==6||!services.length} onClick={()=>{if(services.length)choose(6,()=>setService(services[0]))}}>Select</button>},
              {label:'Sub-category',value:sub,active:step===7,button:<button type="button" disabled={step!==7||!subs.length} onClick={()=>{if(subs.length)choose(7,()=>setSub(subs[0]))}}>Select</button>},
            ];
            return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><p className="notice">Complete the Warehouse steps strictly one by one. The next Select button activates only after the previous step is completed.</p><div className="table-wrap"><table><thead><tr><th>Warehouse Tab</th><th>Selection / Enter</th><th>Button</th></tr></thead><tbody>{rows.map((r,i)=><tr key={r.label}><td><b>{r.label}</b></td><td>{r.value|| (r.done?'Completed':'—')}</td><td>{r.button}</td></tr>)}</tbody></table></div><label>Selected Documents{files.length>0&&<small> ({files.map(f=>f.name).join(', ')})</small>}</label><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step<8} placeholder={step<8?'Available after all Select steps':'Enter remarks'}/></label><button className="primary" disabled={step<8||!files.length||!remarks.trim()||busy} onClick={submit}>Submit to Vendor</button>{msg&&<div className="notice">{msg}</div>}</section>
          }

          '''
          s = s[:start] + wh + s[end:]
          p.write_text(s)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 Warehouse Upload Docs fix'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
