name: P2 fix WH Submitted state
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Fix Warehouse Submitted state filter
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = "if(active==='Submitted') return baseVisible.filter(x=>submittedByRole.has(x.id))"
          new = "if(active==='Submitted'){ if(role===ROLES.WH) return baseVisible.filter(x=>x.current_stage==='GAC_COMPLIANCE' || submittedByRole.has(x.id)); return baseVisible.filter(x=>submittedByRole.has(x.id)) }"
          if old not in s:
              raise SystemExit('Expected Submitted tab filter was not found; refusing to modify App.jsx.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git commit -m "P2: fix WH Submitted state filter"
          git push origin development
          git rm .github/workflows/p2-fix-wh-submitted-state.yml
          git commit -m "P2: remove temporary WH Submitted fixer"
          git push origin development
