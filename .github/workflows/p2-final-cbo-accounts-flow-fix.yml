name: P2 Final CBO Officer to Accounts Flow Fix
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'app/frontend/src/App.jsx'
      - 'app/frontend/src/services/gitDatabase.js'
      - '.github/workflows/p2-final-cbo-accounts-flow-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix CBO Officer approval to Accounts payment pending flow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final CBO Officer to Accounts flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="if(isReceivedProcess&&role===ROLES.CBO_OFFICER)return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT?<button className='primary' onClick={()=>onAction(x,'Submit')}>Submit</button>:<button className='primary' onClick={()=>onAction(x,'Approve')}>Approved</button>}</div>;"
          new="if(isReceivedProcess&&role===ROLES.CBO_OFFICER)return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className='primary' onClick={()=>onAction(x,'Approve')}>Approve</button><button onClick={()=>onAction(x,'Query')}>Query</button><button onClick={()=>onAction(x,'Return')}>Return</button><button onClick={()=>onAction(x,'Reject')}>Reject</button></div>;"
          old2="if(role===ROLES.ACCOUNTS&&x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT&&x.current_stage===roleStage[role])return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button onClick={()=>onAction(x,'Paid')}>Paid</button></div>;"
          new2="if(role===ROLES.ACCOUNTS&&x.current_stage===roleStage[role]&&[WORKFLOW_STATUS.SUBMITTED,WORKFLOW_STATUS.APPROVED_FOR_PAYMENT].includes(x.current_status))return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button onClick={()=>onAction(x,'Paid')}>Paid</button></div>;"
          if old in s: s=s.replace(old,new)
          if old2 in s: s=s.replace(old2,new2)
          old3="else if(act==='Approve'){ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage='ACCOUNTS'}"
          new3="else if(act==='Approve'){ns=WORKFLOW_STATUS.SUBMITTED;nstage='ACCOUNTS'}"
          if old3 in s: s=s.replace(old3,new3)
          p.write_text(s)

          p=Path('app/frontend/src/services/gitDatabase.js')
          s=p.read_text()
          s=s.replace("if(ok('CBO_OFFICE','SUBMITTED','CBO_OFFICER','SUBMITTED'))return\nif(ok('CBO_OFFICER','SUBMITTED','CBO_OFFICER','APPROVED_FOR_PAYMENT'))return\nif(ok('CBO_OFFICER','SUBMITTED','ACCOUNTS','APPROVED_FOR_PAYMENT'))return\nif(ok('ACCOUNTS','APPROVED_FOR_PAYMENT','ACCOUNTS','PAID'))return", "if(ok('CBO_OFFICE','SUBMITTED','CBO_OFFICER','SUBMITTED'))return\nif(ok('CBO_OFFICE','ACCEPTED','CBO_OFFICER','SUBMITTED'))return\nif(ok('CBO_OFFICER','SUBMITTED','CBO_OFFICER','ACCEPTED'))return\nif(ok('CBO_OFFICER','ACCEPTED','CBO_OFFICER','APPROVED_FOR_PAYMENT'))return\nif(ok('CBO_OFFICER','SUBMITTED','CBO_OFFICER','APPROVED_FOR_PAYMENT'))return\nif(ok('CBO_OFFICER','ACCEPTED','ACCOUNTS','SUBMITTED'))return\nif(ok('CBO_OFFICER','SUBMITTED','ACCOUNTS','SUBMITTED'))return\nif(ok('CBO_OFFICER','ACCEPTED','ACCOUNTS','APPROVED_FOR_PAYMENT'))return\nif(ok('CBO_OFFICER','SUBMITTED','ACCOUNTS','APPROVED_FOR_PAYMENT'))return\nif(ok('ACCOUNTS','SUBMITTED','ACCOUNTS','PAID'))return\nif(ok('ACCOUNTS','APPROVED_FOR_PAYMENT','ACCOUNTS','PAID'))return")
          p.write_text(s)
      - name: Commit final flow fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/frontend/src/App.jsx app/frontend/src/services/gitDatabase.js
          git diff --cached --quiet || git commit -m 'Apply final CBO Officer to Accounts payment flow'
          git push