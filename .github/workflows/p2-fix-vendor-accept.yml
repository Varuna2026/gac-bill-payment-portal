name: P2 Vendor Accept Fix

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/p2-fix-vendor-accept.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Patch Vendor document-view gating
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = "const openDoc=async req=>{try{const docs=await selectRows('document_records',`&request_id=eq.${req.id}`);if(!docs.length){alert('No Warehouse document found.');return false}let opened=false;for(const d of docs){const blob=await readRDFile(d.storage_path);if(!blob)continue;const url=URL.createObjectURL(blob);const w=window.open(url,'_blank','noopener,noreferrer');if(w){opened=true;w.addEventListener('load',()=>w.print())}}if(opened)setViewed(v=>({...v,[req.id]:true}));return opened}catch(e){alert(e.message);return false}}"
          new = "const openDoc=async req=>{try{const docs=await selectRows('document_records',`&request_id=eq.${req.id}`,token);if(!docs.length){alert('No Warehouse document found.');return false}let readAny=false;for(const d of docs){const blob=await readRDFile(d.storage_path);if(!blob)continue;readAny=true;const url=URL.createObjectURL(blob);const w=window.open(url,'_blank','noopener,noreferrer');if(w){w.addEventListener('load',()=>w.print())}}if(readAny)setViewed(v=>({...v,[req.id]:true}));return readAny}catch(e){alert(e.message);return false}}"
          if old not in s:
              raise SystemExit('Expected Vendor openDoc code was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/frontend/src/App.jsx
          git commit -m 'Fix Vendor Accept activation after document view'
          git push origin development
