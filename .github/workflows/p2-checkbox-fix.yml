name: P2 Warehouse checkbox crash fix

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P2 Warehouse checkbox source fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix checkbox handler
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old='[...v,id]'
          new='[...v,x.id]'
          if old not in s:
              raise SystemExit('Expected Warehouse checkbox handler was not found')
          p.write_text(s.replace(old,new))
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          git commit -m 'Apply P2 Warehouse checkbox source fix'
          git push origin development
