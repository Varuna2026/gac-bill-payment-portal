name: P2 universal routing fix
on:
  push:
    branches: [development]
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix universal P2 routing' && github.event.head_commit.message != 'Repair P2 universal routing' && github.event.head_commit.message != 'Implement universal pending accept gate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair App.jsx
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          pattern=r"const\s+incomingStatuses\s*=\s*\[[^\]]*\]"
          replacement="const incomingStatuses=[WORKFLOW_STATUS.SUBMITTED,WORKFLOW_STATUS.PENDING,WORKFLOW_STATUS.PR_MAPPED,WORKFLOW_STATUS.COMPLIANCE_CHECKED,WORKFLOW_STATUS.PO_MAPPED,WORKFLOW_STATUS.ACCEPTED,WORKFLOW_STATUS.UNDER_COMPLIANCE_CHECK]"
          matches=list(re.finditer(pattern,s,re.S))
          if matches:
              s=s[:matches[0].start()]+replacement+s[matches[0].end():]
              matches=list(re.finditer(pattern,s,re.S))
              for m in reversed(matches[1:]):
                  s=s[:m.start()]+s[m.end():]
          s=s.replace("else if(act==='Compliance Check OK'){ns=WORKFLOW_STATUS.COMPLIANCE_CHECKED;nstage='GAC_PO'}", "else if(act==='Compliance Check OK'){ns=WORKFLOW_STATUS.SUBMITTED;nstage='GAC_PO'}")
          s=s.replace("else if(role===ROLES.ACCOUNTS)nstage='CBO_OFFICE';else if(role===ROLES.CBO_OFFICE)nstage='CBO_OFFICER';", "else if(role===ROLES.ACCOUNTS){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICE'}else if(role===ROLES.CBO_OFFICE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICER'}")
          s=s.replace("if(act==='Accept'){ns=WORKFLOW_STATUS.ACCEPTED;", "if(routeChoice==='RECEIVE'){ns=WORKFLOW_STATUS.ACCEPTED;nstage=roleStage[role];}else if(act==='Accept'){ns=WORKFLOW_STATUS.ACCEPTED;")
          s=s.replace("return baseVisible.filter(x=>x.current_stage===roleStageKey&&[WORKFLOW_STATUS.SUBMITTED,WORKFLOW_STATUS.PR_MAPPED,WORKFLOW_STATUS.COMPLIANCE_CHECKED,WORKFLOW_STATUS.PO_MAPPED].includes(x.current_status))", "return baseVisible.filter(x=>x.current_stage===roleStageKey&&x.current_status===WORKFLOW_STATUS.ACCEPTED)")
          s=re.sub(r'<th>Process History / User Actions</th><th>Individual TAT</th>', '<th>Individual TAT</th>', s)
          s=re.sub(r'<td>\{hx\.length\?hx\.map\(.*?\):\'No prior workflow action recorded\.\'\}</td><td>\{tat\.individual\.duration\}</td>', '<td>{tat.individual.duration}</td>', s, flags=re.S)
          s=s.replace("const grouped=history.reduce((m,h)=>{(m[h.invoice_id]||(m[h.invoice_id]=[])).push(h);return m},{});", "")
          s=s.replace("const hx=grouped[x.id]||[];", "")
          new_status_table=r'''function StatusTable({data,role,onAction,title,showWarehouseRemarks=false,history=[]}){const acts=actionsByRole[role]||[];const[checked,setChecked]=useState([]);const isPending=title==='Pending for Action'||title==='Pending'||title==='Pending for Approval';const openDocuments=async x=>{try{const q=x.request_id?`&request_id=eq.${x.request_id}`:`&invoice_id=eq.${x.id}`;const docs=await selectRows('document_records',q);if(!docs.length){alert('No documents found for this invoice.');return}for(const d of docs){const blob=await readRDFile(d.storage_path);if(blob){const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener,noreferrer')}}}catch(e){alert(e.message)}};const toggle=x=>setChecked(v=>v.includes(x.id)?v.filter(id=>id!==x.id):[...v,x.id]);const allChecked=isPending&&data.length>0&&checked.length===data.length;const bulkAccept=async()=>{for(const x of data.filter(r=>checked.includes(r.id)))await onAction(x,'Accept','RECEIVE');setChecked([])};const actionButtons=x=>{if(isPending)return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className="link-btn" onClick={()=>openDocuments(x)}>View</button><button className="primary" onClick={()=>onAction(x,'Accept','RECEIVE')}>Accept</button></div>;if(role===ROLES.VENDOR){return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className="primary" onClick={()=>openDocuments(x)}>View</button>{x.current_stage==='VENDOR'&&exceptionStatuses.includes(x.current_status)&&<button onClick={()=>onAction(x,'Vendor Resubmit')}>Re-submit</button>}</div>};if(role===ROLES.GAC_COMPLIANCE&&['PR_MAPPED','SUBMITTED','ACCEPTED','UNDER_COMPLIANCE_CHECK'].includes(x.current_status)){return <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}><button onClick={()=>openDocuments(x)}>View</button>{x.current_status==='ACCEPTED'||x.current_status===WORKFLOW_STATUS.UNDER_COMPLIANCE_CHECK?<><button className="primary" onClick={()=>onAction(x,'Compliance Check OK')}>Compliance Check OK</button><select defaultValue="" onChange={e=>{if(e.target.value)onAction(x,'Compliance Check Rejected',e.target.value)}}><option value="">Compliance Check Rejected</option><option value="WH">Send Back to Warehouse</option><option value="VENDOR">Send Back to Vendor</option></select></>:<button className="primary" onClick={()=>onAction(x,'Accept')}>Accept</button>}<button onClick={()=>onAction(x,'Query')}>Query</button><button onClick={()=>onAction(x,'Return')}>Return</button><button onClick={()=>onAction(x,'Reject')}>Reject</button></div>};if(role===ROLES.ACCOUNTS&&x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT&&x.current_stage===roleStage[role])return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button onClick={()=>onAction(x,'Paid')}>Paid</button></div>;if(acts.length&&x.current_stage===roleStage[role])return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{acts.filter(a=>a!=='Resubmit to GAC Compliance'||x.current_status===WORKFLOW_STATUS.RETURNED).map(a=><button key={a} onClick={()=>onAction(x,a)}>{a}</button>)}</div>;return <button className="link-btn" onClick={()=>openDocuments(x)}>View</button>};return <section className="panel"><div className="panel-heading"><div><h2>{title}</h2><p>{data.length} record(s)</p></div>{isPending&&data.length>0&&<button className="primary" disabled={!checked.length} onClick={bulkAccept}>Accept Selected{checked.length?` (${checked.length})`:''}</button>}</div><div className="table-wrap"><table><thead><tr>{isPending&&<th><input type="checkbox" checked={allChecked} onChange={e=>setChecked(e.target.checked?data.map(x=>x.id):[])} aria-label="Select all invoices"/></th>}<th>Inv No</th><th>Company</th><th>Project / Location</th><th>Vendor</th><th>WH</th><th>Service</th><th>Amount</th>{showWarehouseRemarks&&<th>Warehouse Remarks</th>}<th>Current Status</th><th>Current Message</th><th>Current Stage</th><th>Individual TAT</th><th>Cumulative TAT</th><th>Sun/NH</th><th>Action</th></tr></thead><tbody>{data.map(x=>{const tat=calculateTat({startedAt:x.tat_start_at||x.created_at,endedAt:x.current_status===WORKFLOW_STATUS.PAID?x.paid_at:null,stageStartedAt:x.stage_started_at||x.created_at});return <tr key={x.id}>{isPending&&<td><input type="checkbox" checked={checked.includes(x.id)} onChange={()=>toggle(x)} aria-label={`Select ${x.inv_no||x.id}`}/></td>}<td><b>{x.inv_no||'—'}</b></td><td>{x.company}</td><td>{x.project_location}</td><td>{x.vendor}</td><td>{x.warehouse}</td><td>{x.service_type}<br/><small>{x.contract_type||''}</small></td><td>{money(x.amt_incl_gst)}</td>{showWarehouseRemarks&&<td>{x.warehouse_remarks||'—'}</td>}<td><span className="status">{x.current_status}</span></td><td>{x.status_message||x.latest_remarks||'—'}</td><td>{stageLabel[x.current_stage]||x.current_stage}</td><td>{tat.individual.duration}</td><td>{tat.cumulative.duration}</td><td>Sun {tat.cumulative.sundays.length}<br/>NH {tat.cumulative.nationalHolidays.length}</td><td>{actionButtons(x)}</td></tr>})}</tbody></table>{!data.length&&<div className="empty-state">No records found.</div>}</div></section>}
'''
          s=re.sub(r'function StatusTable\(.*?\nexport default App', new_status_table+'export default App', s, count=1, flags=re.S)
          p.write_text(s)
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix universal P2 routing'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
