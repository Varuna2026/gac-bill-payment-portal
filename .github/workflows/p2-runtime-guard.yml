name: P2 runtime guard wiring
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Apply approved Vendor Accept gate and mapping carry-forward
        run: python3 .github/p2_vendor_fix.py
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'P2: restore Vendor Accept gate and carry mapping'
          git push origin HEAD:development
