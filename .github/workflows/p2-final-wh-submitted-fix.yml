name: P2 final Warehouse Submitted fix

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Patch Warehouse Submitted source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="const whSubmittedRequests=role===ROLES.WH?requests.filter(x=>x.status==='PENDING_VENDOR'&&(profile.warehouses||[]).includes(x.warehouse)&&`${x.vendor||''} ${x.project_location||''} ${x.warehouse||''} ${x.service_type||''}`.toLowerCase().includes(search.toLowerCase()))":[]"
          new="const whSubmittedRequests=role===ROLES.WH?requests.filter(x=>(['PENDING_VENDOR','SUBMITTED_TO_VENDOR'].includes(x.status))&&(profile.warehouses||[]).includes(x.warehouse)&&`${x.vendor||''} ${x.project_location||''} ${x.warehouse||''} ${x.service_type||''}`.toLowerCase().includes(search.toLowerCase()))":[]"
          if old not in s:
              raise SystemExit('Expected Warehouse Submitted filter was not found; stopping without changes.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Commit source and remove temporary workflow
        run: |
          rm -f .github/workflows/p2-final-wh-submitted-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx .github/workflows/p2-final-wh-submitted-fix.yml
          git commit -m "P2: fix Warehouse Submitted tab and deploy" || exit 0
          git push origin development
