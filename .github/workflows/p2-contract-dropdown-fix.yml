name: P2 contract dropdown fix

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix P2 sequential Upload Docs implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P2 fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          # Vendor is a workflow stage too; without this the Vendor Submitted tab
          # has no roleStage key and therefore always renders empty.
          s=s.replace("const roleStage={WH:'WH'", "const roleStage={VENDOR:'VENDOR',WH:'WH'")
          # Prevent a React crash when a Warehouse user ticks an invoice checkbox.
          # The old handler referenced an undefined variable `id`.
          s=s.replace("[...v,id]", "[...v,x.id]")
          # Keep the existing strict Upload Docs implementation from this workflow.
          start=s.index('function WHUpload(')
          end=s.index('function VendorPending(', start)
          new=r'''function WHUpload({profile,mapping,token,onDone}){
  const [step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
  const rows=(mapping||[]).map(x=>({...x,company:x.company||x.organization||'',organization:x.organization||x.company||'',project:x.project||x.project_location||'',project_location:x.project||x.project_location||''}));
  const orgs=[...new Set(rows.map(x=>x.company).filter(Boolean))];
  const whs=[...new Set(rows.filter(x=>x.company===org).map(x=>x.warehouse).filter(Boolean))];
  const projects=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh).map(x=>x.project).filter(Boolean))];
  const vendors=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project).map(x=>x.vendor).filter(Boolean))];
  const contracts=['Commercial Contract','Minimum Wages Contract'];
  const services=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))];
  const subs=P2_SUB_SERVICES[service]||[];
  const field=(label,value,options,index,setter,clearDependent)=><div className="p2-grid-cell"><strong>{label}</strong><div className="p2-select-row"><select value={value} disabled={step<index} onChange={e=>setter(e.target.value)}><option value="">Select {label}</option>{options.map(v=><option key={v} value={v}>{v}</option>)}</select><button type="button" disabled={step!==index||!value} onClick={()=>{clearDependent();setStep(index+1)}}>Select</button></div></div>;
  const chooseFiles=e=>{const next=[...e.target.files];setFiles(next);if(next.length&&step===0)setStep(1)};
  const submit=async()=>{if(step<8||!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length||!remarks.trim())return;try{setBusy(true);const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
  return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><div className="p2-upload-row"><strong>Upload Docs</strong><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" onChange={chooseFiles}/></div><div className="p2-compact-grid">{field('Company',org,orgs,1,setOrg,()=>{setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')})}{field('Warehouse',wh,whs,2,setWh,()=>{setProject('');setVendor('');setContract('');setService('');setSub('')})}{field('Project',project,projects,3,setProject,()=>{setVendor('');setContract('');setService('');setSub('')})}{field('Vendor',vendor,vendors,4,setVendor,()=>{setContract('');setService('');setSub('')})}{field('Contract Type',contract,contracts,5,setContract,()=>{setService('');setSub('')})}{field('Service Type',service,services,6,setService,()=>setSub(''))}{field('Sub-category',sub,subs,7,setSub,()=>{})}</div><div className="p2-bottom-grid"><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step<8} placeholder="Enter remarks"/></label><div><strong>Selected Documents</strong><div>{files.length?files.map(f=><div key={f.name}>{f.name}</div>):'None selected'}</div></div></div><button className="primary" disabled={step<8||!files.length||!remarks.trim()||busy} onClick={submit}>{busy?'Submitting…':'Submit to Vendor'}</button>{msg&&<div className="notice">{msg}</div>}<style>{`.p2-upload-row{display:flex;gap:12px;align-items:center;margin:12px 0}.p2-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.p2-grid-cell{min-width:0}.p2-grid-cell strong{display:block;margin-bottom:5px}.p2-select-row{display:flex;gap:6px}.p2-select-row select{flex:1;min-width:0;box-sizing:border-box}.p2-select-row button{white-space:nowrap}.p2-bottom-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:10px}.p2-bottom-grid textarea{width:100%;min-height:70px;box-sizing:border-box}@media(max-width:900px){.p2-compact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.p2-compact-grid,.p2-bottom-grid{grid-template-columns:1fr}}`}</style></section>
}

'''
          s=s[:start]+new+s[end:]
          s=s.replace('Project / Location','Project').replace('Project & Location','Project')
          s=re.sub(r'Universal sequential selection:[^<\n}]*','',s,flags=re.I)
          s=re.sub(r'Complete the steps in order\.[^<\n}]*','',s,flags=re.I)
          p.write_text(s)
          root=Path('app/frontend/src')
          for f in root.rglob('*'):
            if f.is_file() and f.suffix in {'.js','.jsx','.css','.md'} and f!=p:
              t=f.read_text();u=t.replace('Project / Location','Project').replace('Project & Location','Project')
              u=re.sub(r'Universal sequential selection:[^<\n}]*','',u,flags=re.I)
              u=re.sub(r'Complete the steps in order\.[^<\n}]*','',u,flags=re.I)
              if u!=t:f.write_text(u)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src
          git commit -m 'Fix P2 vendor submitted tab' || exit 0
          git push origin development
