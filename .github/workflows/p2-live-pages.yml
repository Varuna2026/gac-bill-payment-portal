name: P2 Live Pages

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: p2-accounts-final
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Verify Accounts payment-stage workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/frontend/src/App.jsx').read_text()
          required=["current_status===WORKFLOW_STATUS.ACCEPTED","TDS Amount","Deduction Amount","Total Amount","UTR No","Payment details entered"]
          for x in required:
            if x not in s: raise SystemExit(f'Missing Accounts payment-stage implementation: {x}')
          if "window.prompt('TDS Amount" in s or "P2_ACCOUNTS_APPROVED_FOR_PAYMENT_HANDLER_GUARD" in s:
            raise SystemExit('Old Accounts popup/gate implementation is still present')
          print('Accounts payment-stage source verification: PASS')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Accounts payment-stage build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
