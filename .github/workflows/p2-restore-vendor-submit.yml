name: P2 restore Vendor Submit flow
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Restore App.jsx from known good parent and wire Submit
        shell: bash
        run: |
          git checkout f6bd3ffb43b56f09d730160a77bcac9f74067278 -- app/frontend/src/App.jsx
          python - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text(encoding='utf-8')
          old='<button className="primary" disabled={busy}>{busy?\'Submitting…\':\'Submit to Warehouse\'}</button>'
          new='<button type="button" className="primary" disabled={busy} onClick={submit}>{busy?\'Submitting…\':\'Submit to Warehouse\'}</button>'
          if old not in s:
              raise SystemExit('Expected Vendor Submit button not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git commit -m "P2: restore and fix Vendor Submit to Warehouse"
          git rm .github/workflows/p2-restore-vendor-submit.yml
          git commit -m "P2: remove temporary Vendor submit restore workflow"
          git push origin development
