name: P2 final step fix
on:
  push:
    branches: [development]

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P2 received-under-process fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Fix P2 workflow stages
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          bulk="const bulkAccept=async()=>{for(const x of data.filter(r=>checked.includes(r.id)))await onAction(x,'Accept','RECEIVE');setChecked([])};"
          s=re.sub(re.escape(bulk)+r'(?:'+re.escape(bulk)+r')+',bulk,s)
          pat=r"if\(routeChoice==='RECEIVE'\).*?if\(act==='Accept'\).*?(?=else if\(act==='Compliance Check OK'\))"
          repl="if(routeChoice==='RECEIVE')routeChoice=null;if(act==='Accept'){ns=WORKFLOW_STATUS.ACCEPTED;nstage=roleStage[role]}"
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Accept stage pattern not found')
          pat=r"else if\(act==='Submit'\)\{.*?\}(?=else if\(act==='Compliance Check OK'\))"
          submit="else if(act==='Submit'){if(role===ROLES.WH){const pr=window.prompt('PR Number (required):','');if(!pr)return;extra={pr_number:pr,pr_mapped_by:profile.id,pr_mapped_at:now};ns=WORKFLOW_STATUS.PR_MAPPED;nstage='GAC_COMPLIANCE'}else if(role===ROLES.GAC_COMPLIANCE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='GAC_PO'}else if(role===ROLES.GAC_PO){const poRows=await selectRows('pr_po_utr',`&invoice_id=eq.${inv.id}`,token);if(!poRows.length||!poRows[0].po_number){setError('Save the PO Number before Submit.');return}ns=WORKFLOW_STATUS.PO_MAPPED;nstage='ACCOUNTS'}else if(role===ROLES.ACCOUNTS){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICE'}else if(role===ROLES.CBO_OFFICE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICER'}else return}"
          if re.search(pat,s,re.S): s=re.sub(pat,submit,s,count=1,flags=re.S)
          else:
            marker="else if(act==='Compliance Check OK')";i=s.find(marker)
            if i<0: raise SystemExit('Submit insertion point not found')
            s=s[:i]+submit+s[i:]
          pat=r"else if\(act==='PO Mapping'\)\{.*?\}(?=else if\(act==='Approve'\)|else if\(\['Query','Return','Reject'\]\))"
          repl="else if(act==='PO Mapping'){const po=(routeChoice||'').trim();if(!po)return;extra={po_number:po,po_mapped_by:profile.id,po_mapped_at:now};ns=WORKFLOW_STATUS.ACCEPTED;nstage='GAC_PO'}"
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n>1: raise SystemExit('Multiple PO Mapping patterns found')
          pat=r"if\(active==='Received'\)\{.*?if\(active==='Under Process'\).*?\n   \}"
          repl="if(active==='Received & Under Process'||active==='Received'||active==='Under Process'){\n     if(role===ROLES.VENDOR)return baseVisible.filter(x=>x.current_stage==='VENDOR'&&x.current_status===WORKFLOW_STATUS.PENDING)\n     return baseVisible.filter(x=>x.current_stage===roleStageKey&&[WORKFLOW_STATUS.ACCEPTED,WORKFLOW_STATUS.UNDER_COMPLIANCE_CHECK].includes(x.current_status))\n   }"
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n>1: raise SystemExit('Multiple combined tab patterns found')
          pat=r"function StatusTable\(\{data,role,onAction,title,showWarehouseRemarks=false,history=\[\]\}\)\{const acts=actionsByRole\[role\]\|\|\[\];const isPending=.*?const openDocuments="
          repl="function StatusTable({data,role,onAction,title,showWarehouseRemarks=false,history=[]}){const acts=actionsByRole[role]||[];const isPending=title==='Pending for Action'||title==='Pending'||title==='Pending for Approval';const isReceivedProcess=title==='Received & Under Process'||title==='Received'||title==='Under Process';const[checked,setChecked]=useState([]);const[poDraft,setPoDraft]=useState({});const[savedPO,setSavedPO]=useState({});const openDocuments="
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n>1: raise SystemExit('Multiple StatusTable patterns found')
          pat=r"(?:const bulkAccept=.*?;)?const actionButtons=x=>\{if\(isPending\)return"
          repl="const bulkAccept=async()=>{for(const x of data.filter(r=>checked.includes(r.id)))await onAction(x,'Accept','RECEIVE');setChecked([])};const savePO=async x=>{const po=(poDraft[x.id]||'').trim();if(!po)return;await onAction(x,'PO Mapping',po);setSavedPO(v=>({...v,[x.id]:po}))};const submitPO=async x=>{if(!savedPO[x.id])return;await onAction(x,'Submit')};const actionButtons=x=>{if(isReceivedProcess&&role===ROLES.GAC_PO)return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><input value={poDraft[x.id]||''} onChange={e=>setPoDraft(v=>({...v,[x.id]:e.target.value}))} placeholder='PO Number' style={{minWidth:150}}/><button className='primary' onClick={()=>savePO(x)} disabled={!poDraft[x.id]}>Save</button><button className='link-btn' onClick={()=>savePO(x)} disabled={!poDraft[x.id]}>Change PO</button><button className='primary' onClick={()=>submitPO(x)} disabled={!savedPO[x.id]}>Submit</button></div>;if(isPending)return"
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n>1: raise SystemExit('Multiple action button patterns found')
          p.write_text(s)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 received-under-process fix'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
