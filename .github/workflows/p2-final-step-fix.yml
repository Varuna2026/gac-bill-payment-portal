name: P2 final step fix

on:
  push:
    branches:
      - development

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply complete P2 workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          msg='${{ github.event.head_commit.message }}'
          if msg == 'Apply P2 received-under-process fix': raise SystemExit(0)

          # Receipt-only Accept.
          s=s.replace("if(routeChoice==='RECEIVE')routeChoice=null;if(act==='Accept'){ns=WORKFLOW_STATUS.ACCEPTED;nstage=roleStage[role]}", "if(routeChoice==='RECEIVE')routeChoice=null;if(act==='Accept'){ns=WORKFLOW_STATUS.ACCEPTED;nstage=roleStage[role]}", 1)

          # Replace the current Submit branch with the complete sequential routing.
          start=s.find("else if(act==='Submit'){")
          end=s.find("else if(act==='Compliance Check OK')", start)
          if start>=0 and end>start:
              submit="else if(act==='Submit'){if(role===ROLES.WH){const pr=window.prompt('PR Number (required):','');if(!pr)return;extra={pr_number:pr,pr_mapped_by:profile.id,pr_mapped_at:now};ns=WORKFLOW_STATUS.PR_MAPPED;nstage='GAC_COMPLIANCE'}else if(role===ROLES.GAC_COMPLIANCE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='GAC_PO'}else if(role===ROLES.GAC_PO){const poRows=await selectRows('pr_po_utr',`&invoice_id=eq.${inv.id}`,token);if(!poRows.length||!poRows[0].po_number){setError('PO Number is mandatory before Submit.');return}const returnedFromCbo=history.filter(h=>h.invoice_id===inv.id&&h.from_stage==='CBO_OFFICE'&&h.to_stage==='GAC_PO').length;ns=WORKFLOW_STATUS.PO_MAPPED;nstage=returnedFromCbo>=2?'ACCOUNTS':'CBO_OFFICE'}else if(role===ROLES.CBO_OFFICE){ns=WORKFLOW_STATUS.SUBMITTED;nstage='GAC_PO'}else if(role===ROLES.ACCOUNTS){ns=WORKFLOW_STATUS.SUBMITTED;nstage='CBO_OFFICER'}else if(role===ROLES.CBO_OFFICER){if(inv.current_status!==WORKFLOW_STATUS.APPROVED_FOR_PAYMENT){setError('Approve the invoice before Submit.');return}ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage='ACCOUNTS'}else return}"
              s=s[:start]+submit+s[end:]

          # CBO Officer Approved is a gate; Submit follows it.
          s=s.replace("else if(act==='Approve'){ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage='ACCOUNTS'}", "else if(act==='Approve'){ns=WORKFLOW_STATUS.APPROVED_FOR_PAYMENT;nstage=roleStage[role]}", 1)

          # Final Accounts payment captures required TDS, deduction, paid amount and UTR.
          start=s.find("else if(act==='Paid'){")
          end=s.find("else if(act==='PO Mapping')", start)
          if start>=0 and end>start:
              paid="else if(act==='Paid'){const tds=window.prompt('TDS Amount (required):','0');if(tds===null||tds.trim()===''||isNaN(Number(tds)))return;const deduction=window.prompt('Deduction Amount (required):','0');if(deduction===null||deduction.trim()===''||isNaN(Number(deduction)))return;const paid=window.prompt('PAID Amount (required):','');if(paid===null||paid.trim()===''||isNaN(Number(paid)))return;const utr=window.prompt('UTR Number (required):','');if(!utr)return;extra={tds_amount:Number(tds).toFixed(2),deduction_amount:Number(deduction).toFixed(2),paid_amount:Number(paid).toFixed(2),utr_number:utr,utr_mapped_by:profile.id,utr_mapped_at:now};ns=WORKFLOW_STATUS.PAID;nstage='ACCOUNTS'}\n   "
              s=s[:start]+paid+s[end:]

          # CBO Office query can return only to Vendor, Warehouse or GAC PO.
          s=s.replace("CBO_OFFICE:['ACCOUNTS','GAC_PO','WH']", "CBO_OFFICE:['VENDOR','WH','GAC_PO']", 1)

          # Add CBO Officer Approved -> Submit controls while preserving existing GAC PO Save/Change PO/Submit controls.
          marker="const actionButtons=x=>{if(isReceivedProcess&&role===ROLES.GAC_PO)"
          start=s.find(marker)
          end=s.find(";if(isPending)return", start)
          if start>=0 and end>start:
              prefix="const actionButtons=x=>{if(isReceivedProcess&&role===ROLES.GAC_PO)return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><input value={poDraft[x.id]||''} onChange={e=>setPoDraft(v=>({...v,[x.id]:e.target.value}))} placeholder='PO Number' style={{minWidth:150}}/><button className='primary' onClick={()=>savePO(x)} disabled={!poDraft[x.id]}>Save</button><button className='link-btn' onClick={()=>savePO(x)} disabled={!poDraft[x.id]}>Change PO</button><button className='primary' onClick={()=>submitPO(x)} disabled={!savedPO[x.id]}>Submit</button></div>;if(isReceivedProcess&&role===ROLES.CBO_OFFICER)return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>{x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT?<button className='primary' onClick={()=>onAction(x,'Submit')}>Submit</button>:<button className='primary' onClick={()=>onAction(x,'Approve')}>Approved</button>}</div>"
              s=s[:start]+prefix+s[end:]

          # Route 2 remains Vendor initiated and hands off to Warehouse, then follows Route 1.
          if "route_type:'VENDOR_INITIATED',current_status:WORKFLOW_STATUS.SUBMITTED,current_stage:'WH'" not in s:
              raise SystemExit('Route-2 handoff missing')

          p.write_text(s)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 received-under-process fix'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
