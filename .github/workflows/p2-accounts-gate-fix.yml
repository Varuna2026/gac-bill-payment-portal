name: P2 Accounts Gate Fix and Deploy

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: p2-accounts-gate-deploy
  cancel-in-progress: false

jobs:
  fix-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Enforce Accounts approved-for-payment gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text()
          marker = 'P2_ACCOUNTS_APPROVED_FOR_PAYMENT_UI_GUARD'
          changed = False
          if marker not in s:
              anchor = 'if(isPending)return'
              if anchor not in s:
                  raise SystemExit('Expected pending-action renderer not found; refusing unsafe edit.')
              guard = "/* P2_ACCOUNTS_APPROVED_FOR_PAYMENT_UI_GUARD */\n   if(isPending&&role===ROLES.ACCOUNTS&&x.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT&&x.current_stage===roleStage[role])return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><button className='link-btn' onClick={()=>openDocuments(x)}>View</button><button className='primary' onClick={()=>onAction(x,'Paid')}>Paid</button></div>;\n   "
              s = s.replace(anchor, guard + anchor, 1)
              changed = True
          handler_marker = 'P2_ACCOUNTS_APPROVED_FOR_PAYMENT_HANDLER_GUARD'
          if handler_marker not in s:
              anchor = "const doAction=async(inv,act,routeChoice)=>{const now=new Date().toISOString();let ns=inv.current_status,nstage=inv.current_stage,extra={}\n"
              if anchor not in s:
                  raise SystemExit('Expected action-handler anchor not found; refusing unsafe edit.')
              guard = "/* P2_ACCOUNTS_APPROVED_FOR_PAYMENT_HANDLER_GUARD */\n   if(role===ROLES.ACCOUNTS&&act==='Accept'&&inv.current_status===WORKFLOW_STATUS.APPROVED_FOR_PAYMENT&&inv.current_stage===roleStage[role]){setError('Accounts: Approved for Payment can only be marked Paid. Accept is not permitted.');return}\n   "
              s = s.replace(anchor, anchor + guard, 1)
              changed = True
          if changed:
              p.write_text(s)
          PY

      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Accounts gate already correct."
          else
            git add app/frontend/src/App.jsx
            git commit -m "Fix Accounts approved-for-payment UI gate"
            git push origin HEAD:development
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build
        working-directory: app/frontend
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/frontend/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
