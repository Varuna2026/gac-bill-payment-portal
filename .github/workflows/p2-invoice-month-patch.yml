name: P2 temporary invoice month rule patch
on:
  push:
    branches: [development]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Patch invoice month validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          old="const previousInvoiceMonth=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}"
          new="const previousInvoiceMonth=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}\nconst isAllowedInvoiceMonth=month=>{if(!/^\\d{4}-\\d{2}$/.test(String(month||'')))return false;const now=new Date();const current=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;return month===current||month===previousInvoiceMonth()}"
          if old not in s: raise SystemExit('helper anchor not found')
          s=s.replace(old,new,1)
          old2="const raiseInvoice=async(req,payload)=>{const now=new Date().toISOString();try{setBusy(true);const existing="
          new2="const raiseInvoice=async(req,payload)=>{const now=new Date().toISOString();try{if(!isAllowedInvoiceMonth(payload.invoice_month))throw new Error('Invoice Month must be the current month or the immediately previous month only.');setBusy(true);const existing="
          if old2 not in s: raise SystemExit('raiseInvoice anchor not found')
          s=s.replace(old2,new2,1)
          old3="const submit=async e=>{e.preventDefault();if(!invNo.trim()||!invMonth||!invDate||!invoiceFile||!files.length||!taxable){setError('Complete Invoice Number, Invoice Month, Invoice Date, Invoice PDF, Supporting Documents, Taxable Amount and Remarks before Submit.');return}"
          new3="const submit=async e=>{e.preventDefault();if(!invNo.trim()||!invMonth||!invDate||!invoiceFile||!files.length||!taxable){setError('Complete Invoice Number, Invoice Month, Invoice Date, Invoice PDF, Supporting Documents, Taxable Amount and Remarks before Submit.');return}if(!isAllowedInvoiceMonth(invMonth)){setError('Invoice Month must be the current month or the immediately previous month only.');return}"
          if old3 not in s: raise SystemExit('form submit anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git config user.name "Varuna2026"
          git config user.email "debasish.biswas@varuna.net"
          git add app/frontend/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "P2: restrict invoice month to current or previous month"
          git push origin development
