name: P2 UI validation and cleanup

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove forbidden implementation messages and legacy Project label
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('app/frontend/src')
          forbidden=re.compile(r'Universal sequential selection:[^<]*|Complete the steps in order\.[^<]*', re.I)
          for f in root.rglob('*'):
              if not f.is_file() or f.suffix not in {'.js','.jsx','.css','.md'}:
                  continue
              s=f.read_text()
              n=s.replace('Project / Location','Project').replace('Project & Location','Project')
              n=forbidden.sub('',n)
              if n!=s:
                  f.write_text(n)
      - name: Build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove legacy P2 instructional messages and labels'
          git push origin development
