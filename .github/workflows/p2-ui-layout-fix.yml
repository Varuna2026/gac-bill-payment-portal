name: P2 UI layout and mapped selection fix
on:
  push:
    branches: [development]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Restore mapped horizontal selection UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text()
          msg = '${{ github.event.head_commit.message }}'
          if msg == 'Apply P2 Warehouse Upload Docs fix':
              raise SystemExit(0)
          s = s.replace('<p className="login-subtitle">P2V2 secure sign-in</p>', '')
          start = s.find('function WHUpload(')
          end = s.find('function VendorPending(', start)
          if start < 0 or end < 0:
              raise SystemExit('WHUpload component boundaries not found')
          wh = r'''function WHUpload({profile,mapping,token,onDone}){
            const[step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
            const orgs=[...new Set(mapping.map(x=>x.organization).filter(Boolean))];
            const whs=[...new Set(mapping.filter(x=>x.organization===org).map(x=>x.warehouse).filter(Boolean))];
            const projects=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh).map(x=>x.project_location).filter(Boolean))];
            const vendors=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project).map(x=>x.vendor).filter(Boolean))];
            const services=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))];
            const subs=P2_SUB_SERVICES[service]||[];
            const contracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:service?['Commercial','Minimum Wages']:[];
            const selectBox=(label,value,options,active,next,setter,clear)=> <select value={value} disabled={step!==active||!options.length} onChange={e=>{clear();if(e.target.value){setter(e.target.value);setMsg('');setStep(next)}}}><option value="">Select {label}</option>{options.map(v=><option key={v} value={v}>{v}</option>)}</select>;
            const submit=async()=>{if(!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length||!remarks.trim()){setMsg('Complete every selection, upload at least one document, and enter Remarks before Submit.');return}try{setBusy(true);const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
            return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><p className="notice">No value is pre-selected. Choose each mapped value yourself. Each next field activates only after the previous field is selected.</p><div className="table-wrap"><table className="p2-horizontal-table"><thead><tr><th>Upload Docs</th><th>Company</th><th>Warehouse</th><th>Project / Location</th><th>Vendor</th><th>Contract Type</th><th>Service Type</th><th>Sub-category</th></tr></thead><tbody><tr><td><input id="wh-doc-upload" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" onChange={e=>{setFiles([...e.target.files]);if(e.target.files.length)setStep(1)}}/></td><td>{selectBox('Company',org,orgs,1,2,setOrg,()=>{setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')})}</td><td>{selectBox('Warehouse',wh,whs,2,3,setWh,()=>{setProject('');setVendor('');setContract('');setService('');setSub('')})}</td><td>{selectBox('Project / Location',project,projects,3,4,setProject,()=>{setVendor('');setContract('');setService('');setSub('')})}</td><td>{selectBox('Vendor',vendor,vendors,4,5,setVendor,()=>{setContract('');setService('');setSub('')})}</td><td>{selectBox('Contract Type',contract,contracts,5,6,setContract,()=>{setService('');setSub('')})}</td><td>{selectBox('Service Type',service,services,6,7,setService,()=>{setSub('')})}</td><td>{selectBox('Sub-category',sub,subs,7,8,setSub,()=>{})}</td></tr></tbody></table></div><label>Selected Documents{files.length>0&&<small> ({files.map(f=>f.name).join(', ')})</small>}</label><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step<8} placeholder={step<8?'Available after all selections':'Enter remarks'}/></label><button className="primary" disabled={step<8||!files.length||!remarks.trim()||busy} onClick={submit}>{busy?'Submitting…':'Submit to Vendor'}</button>{msg&&<div className="notice">{msg}</div>}</section>
          }

          '''
          s=s[:start]+wh+s[end:]
          p.write_text(s)
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 Warehouse Upload Docs fix'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
