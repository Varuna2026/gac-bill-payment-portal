name: P2 UI layout and mapped selection fix
on:
  push:
    branches: [development]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply Warehouse selection UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/frontend/src/App.jsx')
          s=p.read_text()
          if '${{ github.event.head_commit.message }}' == 'Apply P2 Warehouse Upload Docs fix':
              raise SystemExit(0)
          s=s.replace('<p className="login-subtitle">P2V2 secure sign-in</p>','')
          start=s.find('function WHUpload(')
          end=s.find('function VendorPending(',start)
          if start<0 or end<0: raise SystemExit('WHUpload component boundaries not found')
          wh=r'''function WHUpload({profile,mapping,token,onDone}){
            const[step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
            const orgs=[...new Set(mapping.map(x=>x.organization).filter(Boolean))];
            const whs=[...new Set(mapping.filter(x=>x.organization===org).map(x=>x.warehouse).filter(Boolean))];
            const projects=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh).map(x=>x.project_location).filter(Boolean))];
            const vendors=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project).map(x=>x.vendor).filter(Boolean))];
            const services=[...new Set(mapping.filter(x=>x.organization===org&&x.warehouse===wh&&x.project_location===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))];
            const subs=P2_SUB_SERVICES[service]||[];
            const contracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:service?['Commercial','Minimum Wages']:[];
            const choose=(label,value,options,active,next,setter,clear)=> <div className="p2-choice"><select value={value} disabled={step!==active||!options.length} onChange={e=>setter(e.target.value)}><option value="">Select {label}</option>{options.map(v=><option key={v} value={v}>{v}</option>)}</select><button type="button" className="primary p2-next" disabled={step!==active||!value||busy} onClick={()=>{clear();setMsg('');setStep(next)}}>Select</button></div>;
            const submit=async()=>{if(!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length||!remarks.trim()){setMsg('Complete every selection, upload at least one document, and enter Remarks before Submit.');return}try{setBusy(true);const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
            const cells=[
              ['Upload Docs',<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" onChange={e=>{setFiles([...e.target.files]);if(e.target.files.length)setStep(1)}}/>],
              ['Company',choose('Company',org,orgs,1,2,setOrg,()=>{setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')})],
              ['Warehouse',choose('Warehouse',wh,whs,2,3,setWh,()=>{setProject('');setVendor('');setContract('');setService('');setSub('')})],
              ['Project / Location',choose('Project / Location',project,projects,3,4,setProject,()=>{setVendor('');setContract('');setService('');setSub('')})],
              ['Vendor',choose('Vendor',vendor,vendors,4,5,setVendor,()=>{setContract('');setService('');setSub('')})],
              ['Contract Type',choose('Contract Type',contract,contracts,5,6,setContract,()=>{setService('');setSub('')})],
              ['Service Type',choose('Service Type',service,services,6,7,setService,()=>setSub(''))],
              ['Sub-category',choose('Sub-category',sub,subs,7,8,setSub,()=>{})]
            ];
            return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><p className="notice">Select each mapped value, then press Select. No field is pre-selected and the next field activates only after the previous selection is confirmed.</p><div className="p2-compact-grid">{cells.map(([label,control])=><div className="p2-grid-cell" key={label}><strong>{label}</strong>{control}</div>)}</div><div className="p2-bottom-grid"><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step<8} placeholder={step<8?'Available after all selections':'Enter remarks'}/></label><div><strong>Selected Documents</strong><div>{files.length?files.map(f=><div key={f.name}>{f.name}</div>):'None selected'}</div></div></div><button className="primary" disabled={step<8||!files.length||!remarks.trim()||busy} onClick={submit}>{busy?'Submitting…':'Submit to Vendor'}</button>{msg&&<div className="notice">{msg}</div>}<style>{`.p2-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.p2-grid-cell{min-width:0}.p2-grid-cell strong{display:block;margin-bottom:5px}.p2-choice{display:flex;gap:5px;align-items:center}.p2-choice select{min-width:0;flex:1;width:100%}.p2-next{white-space:nowrap;padding:7px 10px}.p2-bottom-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:10px}.p2-bottom-grid textarea{width:100%;min-height:70px;box-sizing:border-box}@media(max-width:900px){.p2-compact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.p2-compact-grid,.p2-bottom-grid{grid-template-columns:1fr}}`}</style></section>
          }

          '''
          p.write_text(s[:start]+wh+s[end:])
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 Warehouse Upload Docs fix'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
