name: P2 UI layout and mapped selection fix
on:
  push:
    branches: [development]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply universal cascading selection and clean instructional text
        shell: python
        run: |
          from pathlib import Path
          import re

          src=Path('app/frontend/src')
          for f in src.rglob('*'):
              if f.is_file() and f.suffix in {'.js','.jsx','.css','.md'}:
                  text=f.read_text()
                  new=text.replace('Project / Location','Project').replace('Project & Location','Project')
                  # Remove the temporary implementation/instruction messages from every screen.
                  patterns=[
                      r'<p className="notice">Complete the steps in order\. Selecting a value does not lock it\. The current field stays editable until the next field is confirmed with Select\. No value is pre-selected\.</p>',
                      r'<p className="notice">Universal sequential selection:[\s\S]*?</p>',
                  ]
                  for pat in patterns:
                      new=re.sub(pat,'',new)
                  if new != text:
                      f.write_text(new)

          p=src/'App.jsx'
          s=p.read_text()
          if '${{ github.event.head_commit.message }}' in {'Apply P2 universal sequential selection fix','Apply P2 Warehouse Upload Docs fix'}:
              raise SystemExit(0)

          start=s.find('function WHUpload(')
          end=s.find('function VendorPending(',start)
          if start<0 or end<0:
              raise SystemExit('WHUpload component boundaries not found')

          wh=r'''function WHUpload({profile,mapping,token,onDone}){
            const[step,setStep]=useState(0),[org,setOrg]=useState(''),[wh,setWh]=useState(''),[project,setProject]=useState(''),[vendor,setVendor]=useState(''),[contract,setContract]=useState(''),[service,setService]=useState(''),[sub,setSub]=useState(''),[remarks,setRemarks]=useState(''),[files,setFiles]=useState([]),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
            const rows=(mapping||[]).map(x=>({...x,company:x.company||x.organization||'',organization:x.organization||x.company||'',project:x.project||x.project_location||'',project_location:x.project||x.project_location||''}));
            const orgs=[...new Set(rows.map(x=>x.company).filter(Boolean))];
            const whs=[...new Set(rows.filter(x=>x.company===org).map(x=>x.warehouse).filter(Boolean))];
            const projects=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh).map(x=>x.project).filter(Boolean))];
            const vendors=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project).map(x=>x.vendor).filter(Boolean))];
            const services=[...new Set(rows.filter(x=>x.company===org&&x.warehouse===wh&&x.project===project&&x.vendor===vendor).map(x=>x.service_type).filter(Boolean))];
            const subs=P2_SUB_SERVICES[service]||[];
            const contracts=service==='HK'||service==='Security'?['Minimum Wages']:service==='Manpower'?['Commercial','Minimum Wages']:service?['Commercial','Minimum Wages']:[];

            // A selected field stays editable until the user selects the NEXT field.
            // Selecting the current value activates the next field immediately; once the next
            // field receives a value, the previous field becomes locked. No defaults are used.
            const choose=(label,value,options,active,next,setter,clear)=><select value={value} disabled={step<active||step>active+1} onChange={e=>{const v=e.target.value;setter(v);if(v){clear();setStep(next)}else{setStep(active)}}}>
              <option value="">Select {label}</option>
              {options.map(v=><option key={v} value={v}>{v}</option>)}
            </select>;

            const submit=async()=>{if(!org||!wh||!project||!vendor||!contract||!service||!sub||!files.length||!remarks.trim()){setMsg('Complete every selection, upload at least one document, and enter Remarks before Submit.');return}try{setBusy(true);const now=new Date().toISOString();const req=(await insertRows('bill_requests',[{organization:org,company:org,warehouse:wh,project_location:project,project,vendor,contract_type:contract,service_type:service,sub_service:sub,remarks,status:'PENDING_VENDOR',created_at:now,created_by:profile.id}],token))[0];for(const file of files){const stored=await uploadStorage(`requests/${req.id}/${file.name}`,file);await insertRows('document_records',[{request_id:req.id,document_type:'WH Operational Document',document_name:file.name,storage_path:stored.path,source:'browser document storage',uploaded_by:profile.id}],token)}setMsg('Submitted to Vendor.');setFiles([]);setStep(0);setOrg('');setWh('');setProject('');setVendor('');setContract('');setService('');setSub('');setRemarks('');onDone()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
            const cells=[
              ['Upload Docs',<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.csv" onChange={e=>{setFiles([...e.target.files]);if(e.target.files.length)setStep(1)}}/>],
              ['Company',choose('Company',org,orgs,1,2,setOrg,()=>{setWh('');setProject('');setVendor('');setContract('');setService('');setSub('')})],
              ['Warehouse',choose('Warehouse',wh,whs,2,3,setWh,()=>{setProject('');setVendor('');setContract('');setService('');setSub('')})],
              ['Project',choose('Project',project,projects,3,4,setProject,()=>{setVendor('');setContract('');setService('');setSub('')})],
              ['Vendor',choose('Vendor',vendor,vendors,4,5,setVendor,()=>{setContract('');setService('');setSub('')})],
              ['Contract Type',choose('Contract Type',contract,contracts,5,6,setContract,()=>{setService('');setSub('')})],
              ['Service Type',choose('Service Type',service,services,6,7,setService,()=>setSub(''))],
              ['Sub-category',choose('Sub-category',sub,subs,7,8,setSub,()=>{})]
            ];
            return <section className="panel form-panel"><h2>Warehouse — Upload Docs</h2><div className="p2-compact-grid">{cells.map(([label,control])=><div className="p2-grid-cell" key={label}><strong>{label}</strong>{control}</div>)}</div><div className="p2-bottom-grid"><label>Remarks<textarea value={remarks} onChange={e=>setRemarks(e.target.value)} disabled={step<8} placeholder={step<8?'Available after all selections':'Enter remarks'}/></label><div><strong>Selected Documents</strong><div>{files.length?files.map(f=><div key={f.name}>{f.name}</div>):'None selected'}</div></div></div><button className="primary" disabled={step<8||!files.length||!remarks.trim()||busy} onClick={submit}>{busy?'Submitting…':'Submit to Vendor'}</button>{msg&&<div className="notice">{msg}</div>}<style>{`.p2-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.p2-grid-cell{min-width:0}.p2-grid-cell strong{display:block;margin-bottom:5px}.p2-grid-cell select{width:100%;box-sizing:border-box}.p2-bottom-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:10px}.p2-bottom-grid textarea{width:100%;min-height:70px;box-sizing:border-box}@media(max-width:900px){.p2-compact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.p2-compact-grid,.p2-bottom-grid{grid-template-columns:1fr}}`}</style></section>
          }

          '''
          p.write_text(s[:start]+wh+s[end:])
      - name: Build and commit
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply P2 cascading selection and clean UI messages'
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
