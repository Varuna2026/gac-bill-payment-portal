name: P2 PR PO visibility patch
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Patch App.jsx only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/frontend/src/App.jsx')
          s = p.read_text()
          old = "...(extra.pr_number?{pr_number:extra.pr_number}:{}),latest_remarks"
          new = "...(extra.pr_number?{pr_number:extra.pr_number}:{}),...(extra.po_number?{po_number:extra.po_number}:{}),latest_remarks"
          if old not in s:
              raise SystemExit('PR persistence target not found')
          s = s.replace(old, new, 1)
          old = '<th>Inv No</th><th>Company</th><th>Project</th>'
          new = '<th>Inv No</th><th>PR No.</th><th>PO No.</th><th>Company</th><th>Project</th>'
          if old not in s:
              raise SystemExit('Status header target not found')
          s = s.replace(old, new, 1)
          old = '<td><b>{x.inv_no||\'—\'}</b></td><td>{x.company}</td><td>{x.project_location}</td>'
          new = '<td><b>{x.inv_no||\'—\'}</b></td><td>{x.pr_number||\'—\'}</td><td>{x.po_number||\'—\'}</td><td>{x.company}</td><td>{x.project_location}</td>'
          if old not in s:
              raise SystemExit('Status row target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Commit App.jsx only and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/App.jsx
          git rm .github/workflows/p2-pr-po-visibility.yml
          git diff --cached --check
          git diff --cached -- app/frontend/src/App.jsx
          git commit -m "P2: persist and show PR and PO numbers"
          git push origin development
